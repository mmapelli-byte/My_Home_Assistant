      data: {}
    - action: rest_command.camera_giu_timed
      data: {}
    - action: rest_command.bagno_notte_giu_timed
      data: {}
  - delay:
      seconds: 35
  - parallel:
    - action: input_number.set_value
      target:
        entity_id: input_number.cucina_tapparella_posizione
      data:
        value: 100
    - action: input_number.set_value
