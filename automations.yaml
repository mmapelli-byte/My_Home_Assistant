- id: '1766905082297'
  alias: Chiusura Serale Tapparelle
  description: Chiude tutte le tapparelle ogni sera alle 23:30 e aggiorna le posizioni
  triggers:
  - trigger: time
    at: '23:30:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  - parallel:
    - action: rest_command.cucina_giu_timed
      data: {}
    - action: rest_command.sala_piccola_giu_timed
      data: {}
    - action: rest_command.sala_grande_giu_timed
      data: {}
    - action: rest_command.studio_giu_timed
      data: {}
