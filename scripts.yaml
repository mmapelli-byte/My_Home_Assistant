################################################################################
###################### Script Gruppi Tapparelle ################################
################################################################################

# Tutte le tapparelle - APRI
tutte_tapparelle_apri:
  alias: Tutte Tapparelle Apri
  mode: restart
  sequence:
  - service: cover.open_cover
    target:
      entity_id:
        - cover.studio_tapparella
        - cover.cucina_tapparella
        - cover.bagno_tapparella
        - cover.sala_piccola_tapparella
        - cover.sala_grande_tapparella
        - cover.camera_tapparella
        - cover.bagno_notte_tapparella
        - cover.camera_jacopo_tapparella
        - cover.camera_gabriele_tapparella

# Tutte le tapparelle - CHIUDI
tutte_tapparelle_chiudi:
  alias: Tutte Tapparelle Chiudi
  mode: restart
  sequence:
  - service: cover.close_cover
    target:
      entity_id:
        - cover.studio_tapparella
        - cover.cucina_tapparella
        - cover.bagno_tapparella
        - cover.sala_piccola_tapparella
        - cover.sala_grande_tapparella
        - cover.camera_tapparella
        - cover.bagno_notte_tapparella
        - cover.camera_jacopo_tapparella
        - cover.camera_gabriele_tapparella

# Tutte le tapparelle - STOP
tutte_tapparelle_stop:
  alias: Tutte Tapparelle Stop
  mode: restart
  sequence:
  - service: cover.stop_cover
    target:
      entity_id:
        - cover.studio_tapparella
        - cover.cucina_tapparella
        - cover.bagno_tapparella
        - cover.sala_piccola_tapparella
        - cover.sala_grande_tapparella
        - cover.camera_tapparella
        - cover.bagno_notte_tapparella
        - cover.camera_jacopo_tapparella
        - cover.camera_gabriele_tapparella

# Tapparelle Sala (piccola + grande) - APRI
sala_tapparelle_apri:
  alias: Sala Tapparelle Apri
  mode: restart
  sequence:
  - service: cover.open_cover
    target:
      entity_id:
        - cover.sala_piccola_tapparella
        - cover.sala_grande_tapparella

# Tapparelle Sala - CHIUDI
