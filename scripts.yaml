studio_tapparella_apri:
  alias: Studio tapparella apri
  mode: restart
  sequence:
  - service: script.studio_tapparella_set_position
    data:
      position: 0
studio_tapparella_chiudi:
  alias: Studio tapparella chiudi
  mode: restart
  sequence:
  - service: script.studio_tapparella_set_position
    data:
      position: 100
studio_tapparella_stop:
  alias: Studio tapparella stop
  mode: restart
  sequence:
  - service: rest_command.studio_su_blocca
  - service: rest_command.studio_giu_blocca
studio_tapparella_set_position:
  alias: Studio tapparella set position
  mode: restart
  fields:
    position:
      description: Posizione target 0–100
      example: 50
  sequence:
  - variables:
      target_pos: '{{ position | int }}'
      current_pos: '{{ states(''input_number.studio_tapparella_posizione'') | int
        }}'
      total_time: 25
      diff: '{{ (target_pos - current_pos) | abs }}'
      run_time: '{{ (diff / 100 * total_time) | float }}'
      dir_down: '{{ target_pos > current_pos }}'
      step_time: 0.5
      steps: '{{ (run_time / step_time) | int }}'
      step_delta: "{% if steps == 0 %}\n  0\n{% else %}\n  {{ (diff / steps) | float
        }}\n{% endif %}"
  - service: rest_command.studio_su_blocca
  - service: rest_command.studio_giu_blocca
  - if:
    - '{{ dir_down }}'
    then:
    - service: rest_command.studio_tapparella_giu
    else:
    - service: rest_command.studio_tapparella_su
  - repeat:
      count: '{{ steps }}'
      sequence:
      - delay:
          seconds: '{{ step_time }}'
      - variables:
          cur: '{{ states(''input_number.studio_tapparella_posizione'') | float }}'
          new_val: "{% if dir_down %}\n  {{ [cur + step_delta, target_pos] | min }}\n{%
            else %}\n  {{ [cur - step_delta, target_pos] | max }}\n{% endif %}"
      - service: input_number.set_value
        target:
          entity_id: input_number.studio_tapparella_posizione
        data:
          value: '{{ new_val }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.studio_tapparella_posizione
    data:
      value: '{{ target_pos }}'
  - service: rest_command.studio_su_blocca
  - service: rest_command.studio_giu_blocca
