  alias: Sala Tapparelle Chiudi
  mode: restart
  sequence:
  - service: cover.close_cover
    target:
      entity_id:
        - cover.sala_piccola_tapparella
        - cover.sala_grande_tapparella

# Tapparelle Sala - STOP
sala_tapparelle_stop:
  alias: Sala Tapparelle Stop
  mode: restart
  sequence:
  - service: cover.stop_cover
    target:
      entity_id:
        - cover.sala_piccola_tapparella
        - cover.sala_grande_tapparella

# Tapparelle Zona Notte - APRI
zona_notte_tapparelle_apri:
