template:

################################################################################
###############################  Tapparelle ####################################
  - cover:
      - name: "Studio Tapparella"
        unique_id: studio_tapparella
        device_class: shutter
        position: "{{ states('input_number.studio_tapparella_posizione') | int }}"
        current_position: "{{ states('input_number.studio_tapparella_posizione') | int }}"
        open_cover:
          action: script.studio_tapparella_apri
        close_cover:
          action: script.studio_tapparella_chiudi
        stop_cover:
          action: script.studio_tapparella_stop
        set_position:
          action: script.studio_tapparella_set_position
          data:
            position: "{{ position }}"

################################################################################
################################################################################


################################################################################
#####################################  Luci ####################################

  - light:
      - unique_id: light_luce_bagno
        name: Luce Bagno
        state: "{{ is_state('sensor.bagno_luce_status', 'dn') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.bagno_luce_on
        turn_off:
          - action: script.turn_on
            target:
              entity_id: script.bagno_luce_off

