template:
  - sensor:
      # --- CALCOLO SPAZIO LIBERO (Corretto sui tuoi sensori reali) ---
      - name: "nuc_ssd_free_gb"
        unique_id: nuc_ssd_free_gb_manual
        unit_of_measurement: "GB"
        state: >
          {% set total = states('sensor.5_storage_local_ssd_total_capacity') | float(0) %}
          {% set usage = states('sensor.5_storage_local_ssd_usage') | float(0) %}
          {{ (total - (total * usage / 100)) | round(2) }}

      - name: "nuc_seagate_free_gb"
        unique_id: nuc_seagate_free_gb_manual
        unit_of_measurement: "GB"
        state: >
          {% set total = states('sensor.2_disks_nuc_st1000lm010_9yh146_size') | float(0) %}
          {% set usage = states('sensor.5_storage_seagate_hd_1tb_usage') | float(0) %}
          {{ (total - (total * usage / 100)) | round(2) }}

      # --- CARICO CORE E DISCHI VM ---
      - name: "proxmox_cpu_average_per_core"
        unique_id: proxmox_cpu_core_avg
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.1_node_nuc_cpu_usage_nuc', 'cpu_average_per_core') | float(0) | round(2) }}"

      - name: "haos_disk_usage"
        unique_id: haos_disk_percent
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.4_vm_haos_100_status', 'disk_usage_percentage') | float(0) | round(1) }}"

      - name: "ubuntu_disk_usage"
        unique_id: ubuntu_disk_percent
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.4_vm_ubuntu_101_status', 'disk_usage_percentage') | float(0) | round(1) }}"