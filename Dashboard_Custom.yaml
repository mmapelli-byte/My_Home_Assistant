title: Home Control
views:
  - title: Overview
    icon: mdi:home
    cards:
      - type: glance
        title: Lights Status
        show_state: true
        columns: 4
        entities:
          - entity: sensor.camera_luce_status
            name: Bedroom
          - entity: sensor.antibagno_luce_status
            name: Bathroom
          - entity: sensor.corridoio_luce_status
            name: Hallway
          - entity: sensor.bagno_notte_luce_status
            name: Night Bath
          - entity: sensor.studio_luce_status
            name: Office
          - entity: sensor.camera_jacopo_luce_status
            name: Jacopo's Room
          - entity: sensor.camera_gabriele_luce_status
            name: Gabriele's Room
          - entity: sensor.ingresso_1_luce_status
            name: Entry 1
          - entity: sensor.ingresso_2_luce_status
            name: Entry 2
          - entity: sensor.bagno_luce_status
            name: Main Bath
          - entity: sensor.cucina_luce_status
            name: Kitchen
          - entity: sensor.sala_luce_1_status
            name: Living 1
          - entity: sensor.sala_luce_2_status
            name: Living 2
          - entity: sensor.sala_luce_3_status
            name: Living 3

      - type: horizontal-stack
        cards:
          - type: button
            name: All Lights On
            tap_action:
              action: call-service
              service: script.luci_on
            icon: mdi:lightbulb-group
            show_state: false
          - type: button
            name: All Lights Off
            tap_action:
              action: call-service
              service: script.luci_off
            icon: mdi:lightbulb-group-off
            show_state: false

  - title: Lights Control
    icon: mdi:lightbulb
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            entity: light.luce_camera
            name: Bedroom
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_antibagno
            name: Bathroom
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_corridoio
            name: Hallway
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_bagno_notte
            name: Night Bath
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_studio
            name: Office
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_camera_jacopo
            name: Jacopo's Room
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_camera_gabriele
            name: Gabriele's Room
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_ingresso_1
            name: Entry 1
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_ingresso_2
            name: Entry 2
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_bagno
            name: Main Bath
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_cucina
            name: Kitchen
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_sala_1
            name: Living 1
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_sala_2
            name: Living 2
            tap_action:
              action: toggle
            icon: mdi:lightbulb
          - type: button
            entity: light.luce_sala_3
            name: Living 3
            tap_action:
              action: toggle
            icon: mdi:lightbulb

  - title: Shutters Control
    icon: mdi:window-shutter
    cards:
      - type: entities
        title: Bedroom Shutter
        entities:
          - entity: cover.camera_tapparella
            name: Bedroom Shutter
      
      - type: entities
        title: Studio Shutter
        entities:
          - entity: cover.studio_tapparella
            name: Studio Shutter
      
      - type: entities
        title: Cucina Shutter
        entities:
          - entity: cover.cucina_tapparella
            name: Cucina Shutter
      
      - type: entities
        title: Bagno Shutter
        entities:
          - entity: cover.bagno_tapparella
            name: Bagno Shutter
      
      - type: entities
        title: Sala Piccola Shutter
        entities:
          - entity: cover.sala_piccola_tapparella
            name: Sala Piccola Shutter
      
      - type: entities
        title: Sala Grande Shutter
        entities:
          - entity: cover.sala_grande_tapparella
            name: Sala Grande Shutter
      
      - type: entities
        title: Bagno Notte Shutter
        entities:
          - entity: cover.bagno_notte_tapparella
            name: Bagno Notte Shutter
      
      - type: entities
        title: Camera Jacopo Shutter
        entities:
          - entity: cover.camera_jacopo_tapparella
            name: Camera Jacopo Shutter
      
      - type: entities
        title: Camera Gabriele Shutter
        entities:
          - entity: cover.camera_gabriele_tapparella
            name: Camera Gabriele Shutter

  - title: Automations
    icon: mdi:robot
    cards:
      - type: entities
        title: Active Automations
        show_header_toggle: false
        entities:
          - entity: automation.chiusura_studio
            name: Close Office (Voice)
          - entity: automation.apertura_studio
            name: Open Office (Voice)

      - type: history-graph
        title: Light Usage History
        hours_to_show: 24
        refresh_interval: 0
        entities:
          - entity: sensor.camera_luce_status
            name: Bedroom
          - entity: sensor.studio_luce_status
            name: Office
